# appId fica com o nome antigo de propósito: o instalador NSIS deriva dele o
# GUID de desinstalação e o Windows o usa como AppUserModelId. Trocá-lo faria a
# atualização instalar um segundo app ao lado do antigo em vez de substituí-lo.
appId: com.gitweb.app
# Era "GitWeb", que colide com o pacote gitweb do Debian/Ubuntu (a interface
# web CGI do git). A pasta de dados continua a mesma — ver USER_DATA_DIR em
# src/main/index.ts.
productName: OpenGitDesktop
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  # BrowserWindow.icon é resolvido em runtime a partir de __dirname (ver
  # APP_ICON em src/main/index.ts). Sem isto o caminho não existe dentro do
  # asar e a janela cai no ícone padrão do Electron, mesmo com o .exe já
  # carregando o icon.ico correto.
  # O Windows usa o .ico para a janela e a barra de tarefas (o .png de 1024px
  # reduzido pelo sistema fica borrado ou cai no ícone do Electron).
  - build/icon.png
  - build/icon.ico
icon: build/icon.png
publish:
  provider: github
  owner: CariSoftwareBR
  repo: OpenGitDesktop
  # Do not set private: true here — it makes the installed app prefer
  # process.env GH_TOKEN/GITHUB_TOKEN over the in-app GitHub login token.
win:
  target:
    - nsis
  icon: build/icon.ico
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.png
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: CariSoftwareBR <63272749+paulocarinhena@users.noreply.github.com>
  icon: build/icon.png
  # O Electron usa o "desktopName" do package.json como WM_CLASS/app_id da
  # janela. Sem ele, e sem o .desktop ter exatamente esse nome, o dock não liga
  # a janela aberta ao atalho e mostra o ícone genérico do Electron.
  syncDesktopName: true
deb:
  # Explícito para não depender do "name" do package.json. Nunca "gitweb": o
  # pacote gitweb oficial do Debian/Ubuntu (interface web CGI do git) tem epoch
  # ("1:2.43.0"), então o apt sempre o considera mais novo e, numa atualização
  # de sistema, "atualiza" o app para ele — removendo-o.
  packageName: opengitdesktop
  # Transição dos nomes publicados antes, para o dpkg remover o pacote antigo
  # ao instalar este no lugar:
  # - "opengitdesktop-gitweb": o nome de contorno usado até a troca de nome;
  # - "gitweb" 0.x: o versionado "<< 1:0" pega só as nossas versões (sem
  #   epoch) e nunca o pacote do Ubuntu.
  fpm:
    - --conflicts=opengitdesktop-gitweb
    - --replaces=opengitdesktop-gitweb
    - --conflicts=gitweb (<< 1:0)
    - --replaces=gitweb (<< 1:0)
nsis:
  # electron-builder's default NSIS artifact name ("${productName} Setup
  # ${version}.exe", with spaces) does not match the filename it separately
  # writes into latest.yml for auto-update ("${productName}-Setup-${version}.exe",
  # dashes) — and GitHub Releases silently turns the uploaded space-named
  # file's spaces into dots on top of that. electron-updater then looks for
  # the dashed name from latest.yml, finds neither the dotted nor the
  # space-named asset, and fails with "Cannot find asset". Forcing the
  # artifact name to match latest.yml's dashed convention exactly fixes
  # auto-update and incidentally avoids the GitHub renaming too.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Explícitos para o assistente (janela, cabeçalho) e o desinstalador não
  # dependerem do fallback do electron-builder.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  perMachine: false
