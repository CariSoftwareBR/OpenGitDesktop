name: CodeQL

# Code scanning is free only on public repositories; on a private one without
# GitHub Advanced Security the upload step fails. The job-level `if` keeps the
# workflow green while the repo is private and starts scanning by itself the
# moment it goes public — no edit needed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
