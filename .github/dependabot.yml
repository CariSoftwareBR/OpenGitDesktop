version: 2
updates:
  # Electron ships a full Chromium, so a stale major means shipping known
  # browser CVEs to every user. Weekly checks keep that from drifting again.
  - package-ecosystem: npm
    directory: /GitWeb
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      electron:
        patterns:
          - electron
          - electron-builder
          - electron-updater
          - electron-vite
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
