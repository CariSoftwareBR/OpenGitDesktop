version: 2
updates:
  # Electron ships a full Chromium, so a stale major means shipping known
  # browser CVEs to every user. Weekly checks keep that from drifting again.
  - package-ecosystem: npm
    directory: /GitWeb
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      electron:
        patterns:
          - electron
          - electron-builder
          - electron-updater
          - electron-vite
      # Minor/patch only: React, Tailwind and the other renderer libraries
      # are dev dependencies too, and one incompatible major would block the
      # whole group. Majors come as separate PRs.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    # electron-vite 6 accepts vite only up to ^8 (and so do @tailwindcss/vite,
    # vitest 5 and @vitejs/plugin-react 6): a vite major would break npm ci.
    # Drop this once electron-vite accepts the next vite major.
    ignore:
      - dependency-name: vite
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
